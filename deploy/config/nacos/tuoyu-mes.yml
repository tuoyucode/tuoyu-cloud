spring:
  # 数据库迁移（Flyway）：tuoyu-mes 库由本服务负责迁移，脚本在 tuoyu-business/tuoyu-mes 的 db/migration/mes/mysql 与 db/migration/mes/postgresql（按 TUOYU_DB_TYPE）
  # 支持 MySQL 与 PostgreSQL，连接其他数据库时自动跳过；关闭：TUOYU_FLYWAY_ENABLED=false（关闭后新增的迁移脚本需手工执行）
  flyway:
    enabled: ${TUOYU_FLYWAY_ENABLED:true}
    url: ${datasource.mes.url}
    user: ${datasource.mes.username}
    password: ${datasource.mes.password}
  datasource:
    dynamic:
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      datasource:
        # 主库数据源：tuoyu-mes 库
        master:
          type: ${spring.datasource.type}
          driver-class-name: ${datasource.driver-class-name}
          url: ${datasource.mes.url}
          username: ${datasource.mes.username}
          password: ${datasource.mes.password}
