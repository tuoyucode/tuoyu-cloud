spring:
  # 数据库迁移（Flyway，见 docs/adr/0004-数据库迁移.md）：tuoyu-cloud 库由本服务负责迁移，脚本在 tuoyu-modules/tuoyu-system 的 db/migration/cloud/mysql 与 db/migration/cloud/postgresql（按 TUOYU_DB_TYPE）
  # 支持 MySQL 与 PostgreSQL，连接其他数据库时自动跳过；关闭：TUOYU_FLYWAY_ENABLED=false（关闭后新增的迁移脚本需手工执行）
  # 已有数据库首次启用前，必须先执行完 deploy/sql/upgrade 下的全部升级脚本，再按基线版本 1 接入
  flyway:
    enabled: ${TUOYU_FLYWAY_ENABLED:true}
    url: ${datasource.system-master.url}
    user: ${datasource.system-master.username}
    password: ${datasource.system-master.password}
  datasource:
    dynamic:
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driver-class-name: ${datasource.driver-class-name}
          url: ${datasource.system-master.url}
          username: ${datasource.system-master.username}
          password: ${datasource.system-master.password}

tuoyu:
  system:
    # 管理员 admin 的初始口令（TUOYU_ADMIN_INITIAL_PASSWORD，至少 8 位）：启动时 admin 仍是种子数据中公开的口令则改为它；
    # 不设置时生产环境拒绝启动。口令改过后不会被覆盖
    admin-initial-password: ${TUOYU_ADMIN_INITIAL_PASSWORD:}
