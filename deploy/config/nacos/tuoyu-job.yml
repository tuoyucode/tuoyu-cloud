spring:
  datasource:
    dynamic:
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      seata: false
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driver-class-name: ${datasource.driver-class-name}
          url: ${datasource.job.url}
          username: ${datasource.job.username}
          password: ${datasource.job.password}

snail-job:
  enabled: true
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "tuoyu_group"
  #  SnailJob 接入验证令牌
  token: ${TUOYU_SNAILJOB_TOKEN}
  server:
    # 从 nacos 获取服务
    server-name: tuoyu-snailjob-server
    # 服务名优先 ip垫底
    host: 127.0.0.1
    port: 17888
  # 命名空间，对应 tuoyu-job 库 `sj_namespace` 表的 `unique_id`：种子数据中有 dev、prod，
  # 执行器分组 tuoyu_group 在这两个命名空间下各有一条，按当前环境（TUOYU_PROFILES_ACTIVE）选择
  namespace: ${spring.profiles.active}
  # 随主应用端口飘逸
  port: 2${server.port}
  # 客户端ip指定
  host:
