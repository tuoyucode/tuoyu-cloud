spring:
  # 数据库迁移（Flyway，见 docs/adr/0004-数据库迁移.md）：tuoyu-job 库由本服务负责迁移，脚本在 tuoyu-visual/tuoyu-snailjob-server 的 db/migration/job/mysql 与 db/migration/job/postgresql（按 TUOYU_DB_TYPE）
  # 支持 MySQL 与 PostgreSQL，连接其他数据库时自动跳过；关闭：TUOYU_FLYWAY_ENABLED=false（关闭后新增的迁移脚本需手工执行）
  # 已有数据库首次启用前，必须先执行完 deploy/sql/upgrade 下的全部升级脚本，再按基线版本 1 接入
  flyway:
    enabled: ${TUOYU_FLYWAY_ENABLED:true}
    url: ${datasource.job.url}
    user: ${datasource.job.username}
    password: ${datasource.job.password}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: ${datasource.driver-class-name}
    url: ${datasource.job.url}
    username: ${datasource.job.username}
    password: ${datasource.job.password}
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 900000
      keepaliveTime: 30000
  cloud:
    nacos:
      discovery:
        metadata:
          # 解决 er 服务有 context-path 无法监控问题
          management.context-path: ${server.servlet.context-path}/actuator
          # 监控账号密码
          username: ${TUOYU_MONITOR_USERNAME:tuoyu}
          userpassword: ${TUOYU_MONITOR_PASSWORD}

tuoyu:
  snailjob:
    # 管理员 admin 的口令（TUOYU_SNAILJOB_ADMIN_PASSWORD，至少 8 位）：启动时 admin 仍是公开的默认口令 admin 时改为这个口令；
    # 没有配置时生产环境拒绝启动、开发环境只提示。口令已在管理界面改过时不会覆盖
    admin-password: ${TUOYU_SNAILJOB_ADMIN_PASSWORD:}

# snail-job 服务端配置
snail-job:
  # 服务端节点IP(默认按照`NetUtil.getLocalIpStr()`)
  server-host:
  # 服务端netty的端口号
  server-port: 17888
  # 合并日志默认保存天数
  merge-Log-days: 1
  # 合并日志默认的条数
  merge-Log-num: 500
  # 配置每批次拉取重试数据的大小
  retry-pull-page-size: 100
  # 配置日志保存时间（单位：天）
  log-storage: 7
  # bucket的总数量
  bucket-total: 128
  # Dashboard 任务容错天数
  summary-day: 7
  # 配置负载均衡周期时间
  load-balance-cycle-time: 10
  # 重试任务拉取的并行度
  retry-max-pull-parallel: 2
