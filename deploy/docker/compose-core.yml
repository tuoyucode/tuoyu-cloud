# TuoYu-Cloud 微服务核心部署（core）：MySQL、Redis、Nacos + 网关、认证、系统、资源四个核心服务
#
# 在仓库根目录执行（详见同目录 README.md）：
#   java tools/secrets/GenerateEnv.java                                    # 首次：生成 .env
#   mvn clean package                                                       # 构建可执行 jar（镜像从 target 目录复制）
#   docker compose --env-file .env -f deploy/docker/compose-core.yml up -d --build
#
# - 口令全部来自仓库根目录的 .env，本文件不保存任何口令；缺少必填项时 compose 直接报错；
# - 只有网关（8081）对外开放，其余端口只绑定本机回环地址，供本机调试与运维使用；
# - core、full、monolith 三套 compose 的项目名都是 tuoyu，共用同一组数据卷：切换部署方式时数据不用迁移。

name: tuoyu

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Java 服务共用的环境变量。其余变量（口令、开关等）来自 env_file 指定的 .env；
# 这里把中间件地址改为本 compose 中的容器名，覆盖 .env 中面向本机开发的 localhost
x-tuoyu-env: &tuoyu-env
  TZ: Asia/Shanghai
  # 堆内存按容器内存上限的比例计算（上限见各服务的 deploy.resources.limits）
  JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
  TUOYU_NACOS_SERVER: nacos:8848
  TUOYU_NACOS_NAMESPACE: public
  TUOYU_NACOS_USERNAME: nacos
  TUOYU_DB_TYPE: mysql
  TUOYU_DB_HOST: mysql
  TUOYU_DB_PORT: "3306"
  TUOYU_DB_USERNAME: root
  TUOYU_REDIS_HOST: redis
  TUOYU_REDIS_PORT: "6379"

# Java 服务的健康检查：镜像中不一定有 curl，用 bash 直接发 HTTP 请求。
# actuator 需要监控账号（.env 中的 TUOYU_MONITOR_USERNAME / TUOYU_MONITOR_PASSWORD）；
# 要求 HTTP 200 且整体状态为 UP（认证失败时部分服务返回 200 + 错误信息，所以只看状态码不够）
x-java-healthcheck: &java-healthcheck
  test:
    - CMD
    - bash
    - -c
    - |
      exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT} || exit 1
      auth=$$(printf '%s:%s' "$${TUOYU_MONITOR_USERNAME:-tuoyu}" "$${TUOYU_MONITOR_PASSWORD}" | base64 -w0)
      printf 'GET %s HTTP/1.0\r\nHost: localhost\r\nAuthorization: Basic %s\r\n\r\n' "$${HEALTHCHECK_PATH:-/actuator/health}" "$$auth" >&3
      response=$$(timeout 5 cat <&3)
      [[ $$response == HTTP/*' 200'* && $$response == *'"status":"UP"'* ]]
  interval: 10s
  timeout: 10s
  retries: 6
  start_period: 180s

x-java-service: &java-service
  env_file: ../../.env
  restart: unless-stopped
  stop_grace_period: 60s
  logging: *logging
  healthcheck: *java-healthcheck

services:

  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${TUOYU_DB_PASSWORD:?请在 .env 中设置 TUOYU_DB_PASSWORD}
    # 启动参数与 MigrationIntegrationTest 中的一致；lower_case_table_names 只能在初始化数据目录时设置
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据卷为空时执行一次：创建 tuoyu-cloud、tuoyu-workflow、tuoyu-job 三个库，表由各服务的 Flyway 迁移创建
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 初始化期间的临时实例不监听 TCP，所以这里通过 127.0.0.1 检查，初始化完成后才会变为健康
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  redis:
    image: redis:8.6.3
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${TUOYU_REDIS_PASSWORD:?请在 .env 中设置 TUOYU_REDIS_PASSWORD}"]
    environment:
      TZ: Asia/Shanghai
      # 供健康检查中的 redis-cli 使用
      REDISCLI_AUTH: ${TUOYU_REDIS_PASSWORD:?请在 .env 中设置 TUOYU_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  # Nacos 2.x（与本地开发验证过的版本一致；导入工具与启动自检 P6 使用 v1 接口），单机模式、内嵌存储、开启鉴权
  nacos:
    image: nacos/nacos-server:v2.5.1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${TUOYU_NACOS_AUTH_TOKEN:?请在 .env 中设置 TUOYU_NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${TUOYU_NACOS_IDENTITY_KEY:?请在 .env 中设置 TUOYU_NACOS_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${TUOYU_NACOS_IDENTITY_VALUE:?请在 .env 中设置 TUOYU_NACOS_IDENTITY_VALUE}
    ports:
      # 控制台与 HTTP 接口
      - "127.0.0.1:8848:8848"
      # 客户端 gRPC 端口（HTTP 端口 + 1000），本机运行的服务连接 Nacos 时需要
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8848 || exit 1
          printf 'GET /nacos/v1/console/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          response=$$(timeout 5 cat <&3)
          [[ $$response == HTTP/*' 200'* ]]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  # 一次性任务：初始化 Nacos 管理员口令（.env 中的 TUOYU_NACOS_PASSWORD），并导入 deploy/config/nacos 下的配置。
  # 只新建不存在的配置，不覆盖已有配置；仓库中的配置改动后，用 ./dev nacos-import --apply --overwrite 覆盖导入
  nacos-init:
    image: bellsoft/liberica-openjdk-rocky:21.0.12-cds
    user: "1000:1000"
    working_dir: /work
    env_file: ../../.env
    environment:
      <<: *tuoyu-env
      HOME: /tmp
    entrypoint: ["java", "tools/nacos/ImportNacosConfig.java", "--init-admin", "--apply"]
    volumes:
      - ../../tools/nacos:/work/tools/nacos:ro
      - ../config/nacos:/work/deploy/config/nacos:ro
    depends_on:
      nacos:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  tuoyu-system:
    <<: *java-service
    image: tuoyu/tuoyu-system:1.0.0-SNAPSHOT
    build: ../../tuoyu-modules/tuoyu-system
    environment: *tuoyu-env
    volumes:
      - logs:/tuoyu/system/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  tuoyu-auth:
    <<: *java-service
    image: tuoyu/tuoyu-auth:1.0.0-SNAPSHOT
    build: ../../tuoyu-modules/tuoyu-auth
    environment: *tuoyu-env
    volumes:
      - logs:/tuoyu/auth/logs
    depends_on:
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      # 登录需要调用系统服务；系统服务负责 tuoyu-cloud 库的迁移
      tuoyu-system:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  tuoyu-resource:
    <<: *java-service
    image: tuoyu/tuoyu-resource:1.0.0-SNAPSHOT
    build: ../../tuoyu-modules/tuoyu-resource
    environment: *tuoyu-env
    volumes:
      - logs:/tuoyu/resource/logs
    depends_on:
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      tuoyu-system:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  # 网关是唯一对外的入口，端口与单体相同（8081），前端在两种部署方式下访问的地址一致
  tuoyu-gateway:
    <<: *java-service
    image: tuoyu/tuoyu-gateway:1.0.0-SNAPSHOT
    build: ../../tuoyu-gateway
    environment: *tuoyu-env
    ports:
      - "8081:8081"
    volumes:
      - logs:/tuoyu/gateway/logs
    depends_on:
      redis:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      tuoyu-auth:
        condition: service_healthy
      tuoyu-system:
        condition: service_healthy
      tuoyu-resource:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

networks:
  default:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  # 各 Java 服务的日志（logs/<服务名>/ 下），所有服务共用一个卷
  logs:
