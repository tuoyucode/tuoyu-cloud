# redis 密码通过启动参数 --requirepass 传入（见 compose-core.yml），不写在配置文件中

# key 监听器配置
# notify-keyspace-events Ex

# 配置持久化文件存储路径：官方镜像以 redis 用户运行，只有 /data 归它所有（compose 中挂载为数据卷）
dir /data
# 配置rdb
# 15分钟内有至少1个key被更改则进行快照
save 900 1
# 5分钟内有至少10个key被更改则进行快照
save 300 10
# 1分钟内有至少10000个key被更改则进行快照
save 60 10000
# 开启压缩
rdbcompression yes
# rdb文件名 用默认的即可
dbfilename dump.rdb

# 开启aof
appendonly yes
# 文件名
appendfilename "appendonly.aof"
# 持久化策略,no:不同步,everysec:每秒一次,always:总是同步,速度比较慢
# appendfsync always
appendfsync everysec
# appendfsync no
